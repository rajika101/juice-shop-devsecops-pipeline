name: DevSecOps CI

on:
  push:
    branches:
      - develop
      - feature/cicd-security
  pull_request:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ENFORCE_SAST: "false"
  ENFORCE_SCA: "false"
  ENFORCE_IMAGE_SCAN: "false"
  NODE_VERSION: "22"
  IMAGE_NAME: juice-shop:ci

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          

      - name: Install dependencies (also builds the frontend)
        run: npm install

      - name: Run server tests
        run: npm run test:server