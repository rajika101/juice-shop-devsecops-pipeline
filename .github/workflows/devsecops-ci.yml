name: DevSecOps CI

on:
  push:
    branches:
      - develop
      - feature/cicd-security

  pull_request:
    branches:
      - develop
  
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Upgrade npm
        run: npm install -g npm@11  

      - name: Install dependencies
        run: npm install 

      - name: Build application
        run: npm run build
          